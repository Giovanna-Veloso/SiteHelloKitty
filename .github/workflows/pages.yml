name: SiteHelloKitty CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI · Validar site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Preparar e validar o site
        run: |
          mkdir _site
          cp -r index.html assets _site/
          python .github/scripts/check_site.py _site
          printf '%s\n' "$GITHUB_SHA" > _site/versao.txt
      - name: Empacotar para o Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: CD · Publicar no Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000
